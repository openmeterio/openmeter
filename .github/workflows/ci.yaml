name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede stale pull request runs without cancelling independent main runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generators-openapi:
    name: Code Generators / OpenAPI
    runs-on: ubuntu-24.04

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            collector/go.sum
            api/v3/client/go.sum
            e2e/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          # action-setup uses npm to install a temporary pnpm bootstrap package.
          # Its audit does not inspect api/spec dependencies; Dependency Review covers repository dependency changes.
          NPM_CONFIG_AUDIT: "false"
        with:
          package_json_file: api/spec/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/spec/pnpm-lock.yaml

      - name: Record Go cache configuration
        run: go env GOCACHE GOCACHEPROG

      - name: Verify runner tools
        run: |
          yq --version

      - name: Ensure code generators are run
        run: |
          make update-openapi
          pnpm -C api/spec --filter @openmeter/typespec-go run check

          # does not detect new files
          if [ -n "$(git diff --exit-code)" ]; then
            git diff

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

          # detect files not committed
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

  generators-javascript-sdk:
    name: Code Generators / JavaScript SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: api/client/javascript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/client/javascript/pnpm-lock.yaml

      - name: Ensure code generators are run
        run: |
          make generate-javascript-sdk

          # does not detect new files
          if [ -n "$(git diff --exit-code)" ]; then
            git diff

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

          # detect files not committed
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

  generators-go:
    name: Code Generators / Go
    runs-on: depot-ubuntu-24.04-4

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Restore Go module cache
        id: go-module-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-openmeter-go-modules-${{ hashFiles('go.*', 'collector/go.*', 'api/v3/client/go.*', 'e2e/go.*') }}
          restore-keys: |
            ${{ runner.os }}-openmeter-go-modules-

      - name: Verify Depot Go cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          cache_program="$(go env GOCACHEPROG)"

          if [[ "${cache_program}" != *"depot gocache"* ]]; then
            echo "Depot Go cache is unavailable with upstream Go"
            exit 1
          fi

          echo "Using ${cache_program}"

      - name: Ensure code generators are run
        run: |
          make patch-oapi-templates
          go generate ./...

          # does not detect new files
          if [ -n "$(git diff --exit-code)" ]; then
            git diff

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

          # detect files not committed
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

      - name: Save Go module cache
        if: steps.go-module-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.go-module-cache.outputs.cache-primary-key }}

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            collector/go.sum
            api/v3/client/go.sum
            e2e/go.sum

      - name: Record Go cache configuration
        run: go env GOCACHE GOCACHEPROG

      - name: Run Go SDK checks
        run: make test-go-sdk

  test:
    name: Test
    runs-on: depot-ubuntu-24.04-16
    env:
      COMPOSE_FILE: docker-compose.yaml:docker-compose.postgres-test.yaml:.github/docker-compose.depot-registry.yaml
      COMPOSE_PROFILES: redis,depot-registry-svix

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Start dependencies before toolchain setup so their readiness overlaps CI setup.
      - name: Start docker-compose dependencies
        run: |
          docker compose up postgres svix redis clickhouse -d

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify Depot Go cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          cache_program="$(go env GOCACHEPROG)"

          if [[ "${cache_program}" != *"depot gocache"* ]]; then
            echo "Depot Go cache is unavailable with upstream Go"
            exit 1
          fi

          echo "Using ${cache_program}"

      - name: Wait for dependencies to be ready
        run: |
          ./tools/wait-for-compose.sh postgres svix redis clickhouse

      - name: Run tests
        env:
          GO_TEST_PACKAGE_PARALLELISM: 16
          SVIX_HOST: localhost
          TEST_CLICKHOUSE_DSN: ${{ vars.TEST_CLICKHOUSE_DSN }}
          # Dev JWT secret, non-sensitive
          SVIX_JWT_SECRET: DUMMY_JWT_SECRET
        # count=1 is needed to force retest
        run: |
          # On Depot runners, cgo builds during tests can spill temporary files
          # into /run via the default temp dir. Keep Go and system temp files on
          # the workspace disk for this step to avoid "no space left on device".
          mkdir -p \
            "$GITHUB_WORKSPACE/.tmp/go-work" \
            "$GITHUB_WORKSPACE/.tmp/system"
          env \
            GOTMPDIR="$GITHUB_WORKSPACE/.tmp/go-work" \
            TMPDIR="$GITHUB_WORKSPACE/.tmp/system" \
            make test-nocache GO_BUILD_FLAGS=

      - name: Stop docker-compose dependencies
        if: always()
        run: |
          docker compose down -v

  migrations:
    name: Migration Checks
    runs-on: ubuntu-24.04
    env:
      ATLAS_SHA256_AMD64: d88aae186a55e5893c318f3b11c838a3372adf4dac1e2fd3bc7d2b55944c5797
      ATLAS_SHA256_ARM64: bb8a22a08ccd9a6cb93f0a16205b7bbeb067dd7fec1f60227c687d8de93d6088
      ATLAS_VERSION: 0.36.0

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Needed to compare against base branch
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            collector/go.sum
            api/v3/client/go.sum
            e2e/go.sum

      - name: Record Go cache configuration
        run: go env GOCACHE GOCACHEPROG

      - name: Install Atlas
        run: |
          case "$(uname -m)" in
            x86_64)
              atlas_arch="amd64"
              atlas_sha256="${ATLAS_SHA256_AMD64}"
              ;;
            aarch64|arm64)
              atlas_arch="arm64"
              atlas_sha256="${ATLAS_SHA256_ARM64}"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          atlas_path="${RUNNER_TEMP}/bin/atlas"
          mkdir -p "$(dirname "${atlas_path}")"
          curl -fsSL \
            "https://release.ariga.io/atlas/atlas-linux-${atlas_arch}-v${ATLAS_VERSION}" \
            -o "${atlas_path}"
          echo "${atlas_sha256}  ${atlas_path}" | sha256sum --check
          chmod +x "${atlas_path}"
          dirname "${atlas_path}" >> "${GITHUB_PATH}"

      - name: Run migration checks
        run: make migrate-check

  lint-go:
    name: Lint / Go
    runs-on: depot-ubuntu-24.04-8

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Read GolangCI-Lint version
        id: golangci-lint-version
        run: echo "version=$(cat .golangci.version)" >> "$GITHUB_OUTPUT"

      - name: Install GolangCI-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint-version.outputs.version }}
          install-only: true
          skip-cache: true

      - name: Verify Depot Go cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          cache_program="$(go env GOCACHEPROG)"

          if [[ "${cache_program}" != *"depot gocache"* ]]; then
            echo "Depot Go cache is unavailable with upstream Go"
            exit 1
          fi

          echo "Using ${cache_program}"

      - name: Run Go linters
        run: |
          # On Depot runners, golangci-lint still uses Go/system temp space for
          # transient analysis artifacts. Keep those temp files on the workspace
          # disk so lint does not spill into /run and fail with ENOSPC.
          mkdir -p \
            "$GITHUB_WORKSPACE/.tmp/go-work" \
            "$GITHUB_WORKSPACE/.tmp/system"
          env \
            GOTMPDIR="$GITHUB_WORKSPACE/.tmp/go-work" \
            TMPDIR="$GITHUB_WORKSPACE/.tmp/system" \
            make lint-go

  lint-other:
    name: Lint / Other
    runs-on: ubuntu-24.04

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: api/spec/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/spec/pnpm-lock.yaml

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.1

      - name: Run non-Go checks
        run: |
          make lint-api-spec
          make test-api-spec
          pnpm dlx @stoplight/spectral-cli@6.16.0 lint api/openapi.yaml api/openapi.cloud.yaml api/v3/openapi.yaml
          make lint-helm

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pipx run --spec commitizen==4.16.5 cz check --allow-abort --rev-range "${BASE_SHA}..${HEAD_SHA}"

  artifacts:
    name: Artifacts
    uses: $/.github/workflows/artifacts.yaml
    if: ${{ github.event_name == 'push' }}
    with:
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

  benthos-collector-build:
    name: Build / Benthos Collector
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Benthos Collector image
        run: docker build --file benthos-collector.Dockerfile --tag benthos-collector:ci .

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  quickstart:
    name: Quickstart
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROFILES: webhook
      OPENMETER_IMAGE: openmeter-ci:${{ github.sha }}
    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build OpenMeter image
        run: docker build --tag "${OPENMETER_IMAGE}" .

      - name: Create override files for quickstart
        run: |
          cat > quickstart/docker-compose.override.yaml <<EOF
          services:
            openmeter:
              image: $OPENMETER_IMAGE
              pull_policy: never
            sink-worker:
              image: $OPENMETER_IMAGE
              pull_policy: never
            balance-worker:
              image: $OPENMETER_IMAGE
              pull_policy: never
            notification-service:
              image: $OPENMETER_IMAGE
              pull_policy: never
            billing-worker:
              image: $OPENMETER_IMAGE
              pull_policy: never
            openmeter-jobs:
              image: $OPENMETER_IMAGE
              pull_policy: never
          EOF

          cat quickstart/docker-compose.override.yaml

      - name: Debug quickstart runner state
        run: |
          echo "### DEBUG"
          ss -ltnp | grep ':49000 ' || true
          docker ps -a
          docker network ls
          echo "### DEBUG"

      - name: Launch Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.override.yaml up -d
        working-directory: quickstart

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            collector/go.sum
            api/v3/client/go.sum
            e2e/go.sum

      - name: Record Go cache configuration
        run: go env GOCACHE GOCACHEPROG

      - name: Check container health
        run: docker inspect --format "{{json .State.Health }}" $(docker container list --all --filter 'name=^*-openmeter-*' --format '{{.Names}}')
        if: always()
        continue-on-error: true

      - name: Wait for worker to become ready
        run: |
          curl --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:40000/healthz
          docker ps

      - name: Run tests
        env:
          OPENMETER_ADDRESS: http://localhost:48888
        run: go test -v -count=1 ./quickstart/

      - name: Cleanup Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.override.yaml down -v
        working-directory: quickstart
        if: always()

  e2e:
    name: E2E
    runs-on: depot-ubuntu-24.04-8

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Debug E2E runner state
        run: |
          echo "### DEBUG"
          ss -ltnp | grep ':39000 ' || true
          docker ps -a
          docker network ls
          echo "### DEBUG"

      - name: Build as part of E2E
        run: |
          cat > e2e/docker-compose.override.yaml <<EOF
          services:
            openmeter:
              build: ..
            sink-worker:
              build: ..
            billing-worker:
              build: ..
          EOF

          cat e2e/docker-compose.override.yaml

      - name: Launch Docker Compose infra
        id: launch_e2e
        run: docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f ../.github/docker-compose.depot-registry.yaml up -d
        working-directory: e2e

      - name: Start Docker Compose log stream for base tests
        if: always() && steps.launch_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/base
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f ../.github/docker-compose.depot-registry.yaml logs --no-color --timestamps --follow > artifacts/logs/docker-compose/base/compose-follow.log 2>&1 &
          echo "$!" > artifacts/logs/docker-compose/base/compose-follow.pid

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify Depot Go cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          cache_program="$(go env GOCACHEPROG)"

          if [[ "${cache_program}" != *"depot gocache"* ]]; then
            echo "Depot Go cache is unavailable with upstream Go"
            exit 1
          fi

          echo "Using ${cache_program}"

      - name: Check container health
        run: docker inspect --format "{{json .State.Health }}" $(docker container list --all --filter 'name=^*-openmeter-*' --format '{{.Names}}')
        if: always()
        continue-on-error: true

      - name: Wait for worker to become ready
        run: |
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30000/healthz
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30001/healthz
          docker ps

      - name: Run base tests
        id: run_base_tests
        env:
          OPENMETER_ADDRESS: http://localhost:38888
          TZ: UTC
        run: make -C e2e test-base

      - name: Capture Docker Compose logs after base tests
        if: always() && steps.launch_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/base
          if [ -f artifacts/logs/docker-compose/base/compose-follow.pid ]; then
            kill "$(cat artifacts/logs/docker-compose/base/compose-follow.pid)" 2>/dev/null || true
            sleep 1
          fi
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f ../.github/docker-compose.depot-registry.yaml ps --all > artifacts/logs/docker-compose/base/compose-ps.txt 2>&1 || true
          for service in $(docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f ../.github/docker-compose.depot-registry.yaml config --services); do
            docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f ../.github/docker-compose.depot-registry.yaml logs --no-color --timestamps "$service" > "artifacts/logs/docker-compose/base/${service}.log" 2>&1 || true
          done

      - name: Cleanup Docker Compose
        run: docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f ../.github/docker-compose.depot-registry.yaml down -v
        working-directory: e2e
        if: always()

      - name: Upload Openmeter logs as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "[${{ github.job }}] Openmeter logs"
          path: |
            e2e/logs/**
            e2e/artifacts/logs/**
          retention-days: 14

  e2e-credits-disabled:
    name: E2E / Credits disabled
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Debug E2E runner state
        run: |
          echo "### DEBUG"
          ss -ltnp | grep ':39000 ' || true
          docker ps -a
          docker network ls
          echo "### DEBUG"

      - name: Build as part of E2E
        run: |
          cat > e2e/docker-compose.override.yaml <<EOF
          services:
            openmeter:
              build: ..
            sink-worker:
              build: ..
            billing-worker:
              build: ..
          EOF

          cat e2e/docker-compose.override.yaml

      - name: Launch Docker Compose infra with credits disabled
        id: launch_credits_disabled_e2e
        run: docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml up -d
        working-directory: e2e

      - name: Start Docker Compose log stream for credits-disabled tests
        if: always() && steps.launch_credits_disabled_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/credits-disabled
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml logs --no-color --timestamps --follow > artifacts/logs/docker-compose/credits-disabled/compose-follow.log 2>&1 &
          echo "$!" > artifacts/logs/docker-compose/credits-disabled/compose-follow.pid

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            collector/go.sum
            api/v3/client/go.sum
            e2e/go.sum

      - name: Record Go cache configuration
        run: go env GOCACHE GOCACHEPROG

      - name: Check container health
        run: docker inspect --format "{{json .State.Health }}" $(docker container list --all --filter 'name=^*-openmeter-*' --format '{{.Names}}')
        if: always()
        continue-on-error: true

      - name: Wait for worker to become ready with credits disabled
        run: |
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30000/healthz
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30001/healthz
          docker ps

      - name: Run credits-disabled tests
        id: run_credits_disabled_tests
        env:
          OPENMETER_ADDRESS: http://localhost:38888
          TZ: UTC
        run: make -C e2e test-credits-disabled

      - name: Capture Docker Compose logs after credits-disabled tests
        if: always() && steps.launch_credits_disabled_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/credits-disabled
          if [ -f artifacts/logs/docker-compose/credits-disabled/compose-follow.pid ]; then
            kill "$(cat artifacts/logs/docker-compose/credits-disabled/compose-follow.pid)" 2>/dev/null || true
            sleep 1
          fi
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml ps --all > artifacts/logs/docker-compose/credits-disabled/compose-ps.txt 2>&1 || true
          for service in $(docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml config --services); do
            docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml logs --no-color --timestamps "$service" > "artifacts/logs/docker-compose/credits-disabled/${service}.log" 2>&1 || true
          done

      - name: Cleanup Docker Compose
        run: docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml down -v
        working-directory: e2e
        if: always()

      - name: Upload Openmeter logs as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "[${{ github.job }}] Openmeter logs"
          path: |
            e2e/logs/**
            e2e/artifacts/logs/**
          retention-days: 14
