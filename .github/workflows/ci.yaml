name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede stale pull request runs without cancelling an unrelated main run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build components
        run: |
          # Keep potentially large cgo linker files on the workspace disk.
          mkdir -p \
            "$GITHUB_WORKSPACE/.tmp/go-work" \
            "$GITHUB_WORKSPACE/.tmp/system"

          # Kafka integration is not exercised here. Without the dynamic tag,
          # confluent-kafka-go uses its bundled librdkafka on the runner.
          env \
            GOTMPDIR="$GITHUB_WORKSPACE/.tmp/go-work" \
            TMPDIR="$GITHUB_WORKSPACE/.tmp/system" \
            make -j 4 build GO_BUILD_FLAGS=

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Validate commit messages
        run: |
          python -m pip install commitizen==4.16.5
          cz check --allow-abort --rev-range origin/HEAD..HEAD

  generators-openapi:
    name: Code Generators / OpenAPI
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          package-json-file: api/spec/package.json
          cache-dependency-path: api/spec/pnpm-lock.yaml

      - name: Install yq
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/mikefarah/yq/v4@v4.53.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Ensure code generators are run
        run: |
          make update-openapi

          # does not detect new files
          if [ -n "$(git diff --exit-code)" ]; then
            git diff

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

          # detect files not committed
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

      - name: Run TypeSpec Go emitter checks
        run: pnpm -C api/spec --filter @openmeter/typespec-go run check

  generators-javascript-sdk:
    name: Code Generators / JavaScript SDK
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: api/client/javascript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/client/javascript/pnpm-lock.yaml

      - name: Ensure code generators are run
        run: |
          make generate-javascript-sdk

          # does not detect new files
          if [ -n "$(git diff --exit-code)" ]; then
            git diff

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

          # detect files not committed
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

  generators-go:
    name: Code Generators / Go
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Ensure code generators are run
        run: |
          make patch-oapi-templates
          go generate ./...

          # does not detect new files
          if [ -n "$(git diff --exit-code)" ]; then
            git diff

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

          # detect files not committed
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain

            echo "Code generators have not been run, please run 'make generate-all' and commit the changes"
            exit 1
          fi

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run Go SDK checks
        run: |
          go build -C api/v3/client ./...
          go vet -C api/v3/client ./...
          go test -C api/v3/client ./...

  test:
    name: Test
    needs:
      - test-shards
      - migration-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Check test results
        env:
          MIGRATION_TESTS_RESULT: ${{ needs.migration-tests.result }}
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          if [ "$TEST_SHARDS_RESULT" != "success" ] || [ "$MIGRATION_TESTS_RESULT" != "success" ]; then
            echo "Test shards finished with result: $TEST_SHARDS_RESULT"
            echo "Migration tests finished with result: $MIGRATION_TESTS_RESULT"
            exit 1
          fi

  # Temporary benchmark for measuring package-level sharding on the
  # GitHub-hosted fallback. The Test job above keeps the required check stable.
  test-packages:
    name: Plan test shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache: "false"

      - name: Split test packages
        id: packages
        run: |
          matrix="$(
            # The migration suite performs enough concurrent database work to
            # starve when it shares a runner with other packages. Run it in its
            # own job below instead of assigning it to a general-purpose shard.
            go list -f '{{if and (or .TestGoFiles .XTestGoFiles) (ne .ImportPath "github.com/openmeterio/openmeter/tools/migrate")}}{{.ImportPath}}{{end}}' ./... |
              sort |
              jq --raw-input --slurp --compact-output '
                split("\n") | map(select(length > 0)) as $packages |
                ($packages | length) as $count |
                (($count + 2) / 3 | floor) as $chunk_size |
                {
                  include: [
                    range(0; 3) as $index |
                    {
                      shard: ($index + 1),
                      packages: $packages[
                        ($index * $chunk_size):(($index + 1) * $chunk_size)
                      ]
                    }
                  ]
                }
              '
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" |
            jq --raw-output '.include[] | "Shard \(.shard): \(.packages | length) packages"'

  test-shards:
    name: Test shard ${{ matrix.shard }}/3
    needs: test-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-packages.outputs.matrix) }}

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Start dependencies early so their health checks progress during Go setup.
      - name: Start docker-compose dependencies
        run: |
          docker compose up postgres svix redis clickhouse -d

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Wait for dependencies to be ready
        run: |
          ./tools/wait-for-compose.sh postgres svix redis clickhouse

      - name: Run tests
        env:
          TEST_PACKAGES: ${{ toJSON(matrix.packages) }}
          SVIX_HOST: localhost
          TEST_CLICKHOUSE_DSN: ${{ vars.TEST_CLICKHOUSE_DSN }}
          # Dev JWT secret, non-sensitive
          SVIX_JWT_SECRET: DUMMY_JWT_SECRET
        # count=1 is needed to force retest
        run: |
          # Keep potentially large cgo files on the workspace disk. Kafka is not
          # covered by this suite, so use confluent-kafka-go's bundled library.
          mkdir -p \
            "$GITHUB_WORKSPACE/.tmp/go-work" \
            "$GITHUB_WORKSPACE/.tmp/system"
          mapfile -t packages < <(jq --raw-output '.[]' <<< "$TEST_PACKAGES")
          env \
            GOTMPDIR="$GITHUB_WORKSPACE/.tmp/go-work" \
            TMPDIR="$GITHUB_WORKSPACE/.tmp/system" \
            POSTGRES_HOST=127.0.0.1 \
            go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped -- \
              -p 8 -parallel 16 -count=1 "${packages[@]}"

      - name: Stop docker-compose dependencies
        if: always()
        run: |
          docker compose down -v

  migration-tests:
    name: Migration tests
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL
        run: |
          docker compose up postgres -d

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Wait for PostgreSQL to be ready
        run: |
          ./tools/wait-for-compose.sh postgres

      - name: Run migration tests
        run: |
          # Keep potentially large cgo files on the workspace disk and isolate
          # this database-heavy package from the parallel package shards.
          mkdir -p \
            "$GITHUB_WORKSPACE/.tmp/go-work" \
            "$GITHUB_WORKSPACE/.tmp/system"
          env \
            GOTMPDIR="$GITHUB_WORKSPACE/.tmp/go-work" \
            TMPDIR="$GITHUB_WORKSPACE/.tmp/system" \
            POSTGRES_HOST=127.0.0.1 \
            go tool gotestsum --format pkgname-and-test-fails --hide-summary=skipped -- \
              -p 1 -parallel 16 -count=1 ./tools/migrate

      - name: Stop PostgreSQL
        if: always()
        run: |
          docker compose down -v

  migrations:
    name: Migration Checks
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Needed to compare against base branch
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install Atlas
        env:
          ATLAS_VERSION: 0.36.0
          ATLAS_SHA256: d88aae186a55e5893c318f3b11c838a3372adf4dac1e2fd3bc7d2b55944c5797
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --output "$RUNNER_TEMP/bin/atlas" \
            "https://release.ariga.io/atlas/atlas-linux-amd64-v${ATLAS_VERSION}"
          echo "${ATLAS_SHA256}  $RUNNER_TEMP/bin/atlas" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/atlas"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run migration checks
        run: make migrate-check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Lint root Go module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --verbose ./...

      - name: Lint Go SDK module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: api/v3/client
          args: --verbose ./...

      - name: Vet E2E module
        run: go vet -C e2e ./...

      - name: Lint E2E module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: e2e
          args: --verbose ./...

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          package-json-file: api/spec/package.json
          cache-dependency-path: api/spec/pnpm-lock.yaml

      - name: Run linters - api spec
        run: make lint-api-spec

      - name: Run tests - api spec SDK
        run: make test-api-spec

      - name: Run linters - openapi
        run: |
          pnpm dlx @stoplight/spectral-cli@6.16.0 lint \
            api/openapi.yaml api/openapi.cloud.yaml api/v3/openapi.yaml

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Run linters - helm
        run: make lint-helm

  trusted-artifacts:
    name: Artifacts
    uses: ./.github/workflows/artifacts.yaml
    if: ${{ github.event_name == 'push' }}
    with:
      publish: true
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

  untrusted-artifacts:
    name: Untrusted Artifacts
    # PRs only validate Dockerfiles. They never publish images or caches.
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/untrusted-artifacts.yaml
    permissions:
      contents: read

  artifacts-pass:
    name: Artifacts
    needs:
      - trusted-artifacts
      - untrusted-artifacts
    if: ${{ always() }}
    uses: ./.github/workflows/workflow-result.yaml
    with:
      result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || !contains(needs.*.result, 'success')) && 'fail' || 'pass' }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  quickstart:
    name: Quickstart
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build OpenMeter image locally
        run: docker build --build-arg VERSION=ci --tag openmeter:ci .

      - name: Create local image override
        run: |
          cat > quickstart/docker-compose.override.yaml <<'EOF'
          services:
            openmeter:
              image: openmeter:ci
              pull_policy: never
            sink-worker:
              image: openmeter:ci
              pull_policy: never
            balance-worker:
              image: openmeter:ci
              pull_policy: never
            notification-service:
              image: openmeter:ci
              pull_policy: never
            billing-worker:
              image: openmeter:ci
              pull_policy: never
            openmeter-jobs:
              image: openmeter:ci
              pull_policy: never
          EOF

      - name: Debug quickstart runner state
        run: |
          echo "### DEBUG"
          ss -ltnp | grep ':49000 ' || true
          docker ps -a
          docker network ls
          echo "### DEBUG"

      - name: Launch Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.override.yaml up -d
        working-directory: quickstart

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check container health
        run: docker inspect --format "{{json .State.Health }}" $(docker container list --all --filter 'name=^*-openmeter-*' --format '{{.Names}}')
        if: always()
        continue-on-error: true

      - name: Wait for worker to become ready
        run: |
          curl --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:40000/healthz
          docker ps

      - name: Run tests
        env:
          OPENMETER_ADDRESS: http://localhost:48888
        run: go test -v -count=1 ./quickstart/

      - name: Cleanup Docker Compose
        run: docker compose -f docker-compose.yaml -f docker-compose.override.yaml down -v
        working-directory: quickstart
        if: always()

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build OpenMeter image locally
        run: docker build --build-arg VERSION=ci --tag openmeter:ci .

      - name: Create local image override
        run: |
          cat > e2e/docker-compose.override.yaml <<'EOF'
          services:
            openmeter:
              image: openmeter:ci
              pull_policy: never
            sink-worker:
              image: openmeter:ci
              pull_policy: never
            billing-worker:
              image: openmeter:ci
              pull_policy: never
          EOF

      - name: Debug E2E runner state
        run: |
          echo "### DEBUG"
          ss -ltnp | grep ':39000 ' || true
          docker ps -a
          docker network ls
          echo "### DEBUG"

      - name: Launch Docker Compose infra
        id: launch_e2e
        run: docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml up -d
        working-directory: e2e

      - name: Start Docker Compose log stream for base tests
        if: always() && steps.launch_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/base
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml logs --no-color --timestamps --follow > artifacts/logs/docker-compose/base/compose-follow.log 2>&1 &
          echo "$!" > artifacts/logs/docker-compose/base/compose-follow.pid

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check container health
        run: docker inspect --format "{{json .State.Health }}" $(docker container list --all --filter 'name=^*-openmeter-*' --format '{{.Names}}')
        if: always()
        continue-on-error: true

      - name: Wait for worker to become ready
        run: |
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30000/healthz
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30001/healthz
          docker ps

      - name: Run base tests
        id: run_base_tests
        env:
          OPENMETER_ADDRESS: http://localhost:38888
          TZ: UTC
        run: make -C e2e test-base

      - name: Capture Docker Compose logs after base tests
        if: always() && steps.launch_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/base
          if [ -f artifacts/logs/docker-compose/base/compose-follow.pid ]; then
            kill "$(cat artifacts/logs/docker-compose/base/compose-follow.pid)" 2>/dev/null || true
            sleep 1
          fi
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml ps --all > artifacts/logs/docker-compose/base/compose-ps.txt 2>&1 || true
          for service in $(docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml config --services); do
            docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml logs --no-color --timestamps "$service" > "artifacts/logs/docker-compose/base/${service}.log" 2>&1 || true
          done

      - name: Restart Docker Compose infra for credits-disabled tests
        id: restart_credits_disabled_e2e
        run: |
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml down -v
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml up -d
        working-directory: e2e

      - name: Start Docker Compose log stream for credits-disabled tests
        if: always() && steps.restart_credits_disabled_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/credits-disabled
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml logs --no-color --timestamps --follow > artifacts/logs/docker-compose/credits-disabled/compose-follow.log 2>&1 &
          echo "$!" > artifacts/logs/docker-compose/credits-disabled/compose-follow.pid

      - name: Wait for worker to become ready with credits disabled
        run: |
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30000/healthz
          curl --fail --retry 10 --retry-max-time 120 --retry-all-errors http://localhost:30001/healthz
          docker ps

      - name: Run credits-disabled tests
        id: run_credits_disabled_tests
        env:
          OPENMETER_ADDRESS: http://localhost:38888
          TZ: UTC
        run: make -C e2e test-credits-disabled

      - name: Capture Docker Compose logs after credits-disabled tests
        if: always() && steps.restart_credits_disabled_e2e.outcome != 'skipped'
        working-directory: e2e
        run: |
          mkdir -p artifacts/logs/docker-compose/credits-disabled
          if [ -f artifacts/logs/docker-compose/credits-disabled/compose-follow.pid ]; then
            kill "$(cat artifacts/logs/docker-compose/credits-disabled/compose-follow.pid)" 2>/dev/null || true
            sleep 1
          fi
          docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml ps --all > artifacts/logs/docker-compose/credits-disabled/compose-ps.txt 2>&1 || true
          for service in $(docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml config --services); do
            docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml -f docker-compose.credits-disabled.yaml logs --no-color --timestamps "$service" > "artifacts/logs/docker-compose/credits-disabled/${service}.log" 2>&1 || true
          done

      - name: Cleanup Docker Compose
        run: docker compose -f docker-compose.infra.yaml -f docker-compose.openmeter.yaml -f docker-compose.override.yaml down -v
        working-directory: e2e
        if: always()

      - name: Upload Openmeter logs as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "[${{ github.job }}] Openmeter logs"
          path: |
            e2e/logs/**
            e2e/artifacts/logs/**
          retention-days: 14
