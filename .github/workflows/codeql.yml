name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/**"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "api/client/javascript/**"
      - "api/client/python/**"
      - "api/spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.py"
      - "api/client/javascript/**"
      - "api/client/python/**"
      - "api/spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "32 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  # PR runs must not cancel each other in GitHub's unordered concurrency queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-older-runs:
    # Fork and Dependabot tokens cannot cancel runs in this repository.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: write # Required by the cancellation job; other jobs retain their own permissions.
    uses: $/.github/workflows/cancel-stale-pr-runs.yaml

  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL results.
      packages: read # Required for private CodeQL packs.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]

    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
