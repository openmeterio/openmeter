permissions:
  contents: read
  actions: read
  checks: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

name: Security

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]')
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Kong/public-shared-actions/security-actions/secret-scan@343896e36ae2bd71d1dd30ce17ac19ed52152395 # 1.1.1
        name: Running Secret Scan using Trufflehog
        with:
          fail_on_findings: "true"

  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      checks: write
      pull-requests: write
    name: Repository Scan
    if: (github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]')
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Repository
        id: sca_repo
        uses: Kong/public-shared-actions/security-actions/sca@343896e36ae2bd71d1dd30ce17ac19ed52152395 # 6.0.0
        with:
          asset_prefix: openmeter-cloud
          dir: "."
          config: .syft.yaml
          fail_build: "true"

  scan-gh-workflows:
    name: Scan GitHub Workflows
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          use-policy-store: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan GitHub Workflows
        id: scan_gh_workflows
        uses: Kong/public-shared-actions/security-actions/scan-gh-workflows@5d8835e25221a4aa16e7a53ab6e97c7fb2528b7e # 5.0.2
        with:
          fail_on_findings: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
