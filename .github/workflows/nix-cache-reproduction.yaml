name: Nix Cache Reproduction

on:
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    name: Publish isolated Nix cache
    if: github.event.action == 'opened'
    runs-on: depot-ubuntu-latest-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - name: Build Nix environment
        run: |
          nix flake check --impure
          nix develop --impure .#ci

      - name: Save isolated Nix store cache
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ runner.os }}-openmeter-nix-reproduction-${{ github.run_id }}-${{ github.run_attempt }}-${{ hashFiles('flake.*') }}
          save: "true"

  restore-and-generate:
    name: Restore isolated Nix cache and run Go generate
    runs-on: depot-ubuntu-latest-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore isolated Nix store cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: Linux-openmeter-nix-reproduction-33407613225-1-7c539a65ada552b3e146c5696cb3f89a1908a3b92b1d192f21bbe19b587f2780
          fail-on: primary-key.not-restored
          save: "false"

      - name: Probe dynamically linked Go executable
        env:
          GOTMPDIR: ${{ github.workspace }}/.cache-diagnostics/go-tmp
          TMPDIR: ${{ github.workspace }}/.cache-diagnostics/tmp
        run: |
          mkdir -p "${GOTMPDIR}" "${TMPDIR}"
          nix develop --impure .#ci -c bash -euo pipefail <<'EOF'
            probe_source="$(mktemp --suffix=.go)"
            probe_binary="$(mktemp)"
            printf "%s\n" \
              "package main" \
              "/* #include <stdlib.h> */" \
              "import \"C\"" \
              "func main() {}" > "${probe_source}"
            go build -o "${probe_binary}" "${probe_source}"
            file "${probe_binary}"
            readelf -l "${probe_binary}" | grep "Requesting program interpreter"
            "${probe_binary}"
          EOF

      - name: Inspect representative Go binaries
        env:
          GOTMPDIR: ${{ github.workspace }}/.cache-diagnostics/go-tmp
          TMPDIR: ${{ github.workspace }}/.cache-diagnostics/tmp
        run: |
          mkdir -p "${GOTMPDIR}" "${TMPDIR}"
          nix develop --impure .#ci -c bash -euo pipefail <<'EOF'
            inspect_binary() {
              local label="$1"
              local binary="$2"
              shift 2

              echo "::group::${label}"
              file "${binary}"
              go version -m "${binary}" || true

              local interpreter
              interpreter="$(readelf -l "${binary}" | sed -n 's/.*interpreter: \(.*\)]/\1/p')"
              printf 'interpreter=%s\n' "${interpreter:-<none>}"

              if [ -n "${interpreter}" ]; then
                ls -la "${interpreter}" || true

                local store_name="${interpreter#/nix/store/}"
                local store_path="/nix/store/${store_name%%/*}"
                nix-store --verify-path "${store_path}" || true
              fi

              set +e
              "${binary}" "$@"
              local exit_code=$?
              set -e
              printf 'exit_code=%s\n' "${exit_code}"
              echo "::endgroup::"

              return "${exit_code}"
            }

            go env GOOS GOARCH GOFLAGS CGO_ENABLED CC CXX
            printf 'GO_LDSO=%s\n' "${GO_LDSO:-<unset>}"
            printf 'NIX_CC=%s\n' "${NIX_CC:-<unset>}"
            if [ -r "${NIX_CC}/nix-support/dynamic-linker" ]; then
              printf 'active_dynamic_linker='
              cat "${NIX_CC}/nix-support/dynamic-linker"
            fi

            client_test="$(mktemp)"
            go -C api/v3/client test -c -o "${client_test}" .
            inspect_binary "Go SDK test binary" "${client_test}" -test.run '^$' || true

            oapi_codegen="$(mktemp)"
            go build -o "${oapi_codegen}" github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen
            inspect_binary "oapi-codegen" "${oapi_codegen}" -version || true

            entc="$(mktemp)"
            go build -o "${entc}" ./openmeter/ent/entc.go
            inspect_binary "entc" "${entc}" -h || true
          EOF

      - name: Run Go generators
        env:
          GOCACHE: ${{ github.workspace }}/.cache-diagnostics/fixed-go-cache
          GOTMPDIR: ${{ github.workspace }}/.cache-diagnostics/go-tmp
          TMPDIR: ${{ github.workspace }}/.cache-diagnostics/tmp
        run: |
          mkdir -p "${GOCACHE}" "${GOTMPDIR}" "${TMPDIR}"
          nix develop --impure .#ci -c bash -euo pipefail <<'EOF'
            export GO_LDSO="$(cat "${NIX_CC}/nix-support/dynamic-linker")"
            printf 'GO_LDSO override=%s\n' "${GO_LDSO}"
            go generate ./...
          EOF
