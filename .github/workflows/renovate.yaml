name: Renovate

on:
  schedule:
    - cron: '0 6 * * *' # 08:00 CEST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  vulnerability-alerts: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the repository Go version
        id: go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate.json
          renovate-image: ghcr.io/renovatebot/renovate:44.229.0@sha256:3cbb11917cc72ad4caf0ad96ade546447656310f2057e33e24a4398779d9330c
          token: ${{ github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: full
          RENOVATE_ALLOWED_COMMANDS: '["^make mod$"]'
          RENOVATE_BINARY_SOURCE: install
          RENOVATE_CONSTRAINTS: ${{ format('{{"golang":"{0}"}}', steps.go.outputs.version) }}
          RENOVATE_ONBOARDING: 'false'
          # The action loads configurationFile from the checkout.
          RENOVATE_REQUIRE_CONFIG: ignored
