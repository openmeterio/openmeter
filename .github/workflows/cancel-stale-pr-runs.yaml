name: Cancel stale PR runs

on:
  workflow_run:
    workflows: [CI, Container Tests, Benthos Collector, PR Checks, Nix, CodeQL, CodeQL Go]
    # requested handles queued runs; in_progress also handles manual reruns.
    types: [requested, in_progress]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  cancel:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # workflow_run uses the default branch. Never check out the triggering
      # PR's code or download its artifacts with this write-capable token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/tools/ci

      - name: Cancel older runs of the same PR workflow
        run: python3 .github/tools/ci/cancel_stale_pr_runs.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
