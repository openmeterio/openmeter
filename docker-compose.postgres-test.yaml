services:
  postgres:
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=300
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=4GB
