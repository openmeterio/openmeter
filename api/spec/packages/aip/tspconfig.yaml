emit:
  - '@typespec/openapi3'
  - '@openmeter/typespec-typescript'
  - '@openmeter/typespec-go'
  # Notification Event contracts: the JSON Schemas of @jsonSchema payloads and
  # Rule configurations, plus definitions.gen.go and the manifest consumed by
  # scripts/generate-notification-events.mjs.
  - '@typespec/json-schema'
  - '@openmeter/typespec-notification-events'
parameters:
  base-dir:
    default: '{cwd}'
output-dir: '{base-dir}'
options:
  '@typespec/openapi3':
    emitter-output-dir: '{output-dir}/output/definitions/metering-and-billing/v3'
    omit-unreachable-types: true
    seal-object-schemas: true
  '@openmeter/typespec-typescript':
    emitter-output-dir: '{output-dir}/../aip-client-javascript'
    # The npm package name the generated README installs and imports.
    package-name: '@openmeter/client'
    # Markdown callout inserted after the README intro.
    readme-note: |
      > **Important:** This SDK is a work in progress.
      >
      > This SDK targets the [OpenMeter API v3](https://openmeter.io/docs/api/v3),
      > a rewrite of the OpenMeter API following AIP (API Improvement Proposal)
      > standardization.
    # Emit per-operation schemas only for the OpenMeter service.
    include-services:
      - 'OpenMeter'
    # Mirror the TS SDK prefix stripping so the Zod schemas match.
    strip-name-prefixes:
      - 'Billing'
      - 'OpenMeter'
      - 'Metering'
  '@openmeter/typespec-go':
    emitter-output-dir: '{output-dir}/../../../v3/client'
    # Go module path (the published import identity, independent of where the client is generated in the repo).
    module-path: 'github.com/openmeterio/openmeter/api/v3/client'
    # Go package name; deliberately differs from the module path's last segment
    # (same precedent as api/client/go), goimports resolves it.
    package-name: 'openmeter'
    # Markdown callout inserted after the README intro.
    readme-note: |
      > [!IMPORTANT]
      > This SDK is a work in progress.
      >
      > This SDK targets the [OpenMeter API v3](https://openmeter.io/docs/api/v3),
      > a rewrite of the OpenMeter API following AIP (API Improvement Proposal)
      > standardization.
    include-services:
      - 'OpenMeter'
    strip-name-prefixes:
      - 'Billing'
      - 'OpenMeter'
      - 'Metering'
    go-version: '1.26.11'
  '@typespec/json-schema':
    emitter-output-dir: '{output-dir}/output/notification-events/jsonschema'
    file-type: json
    seal-object-schemas: true
  '@openmeter/typespec-notification-events':
    # The leading underscore keeps Go tooling from treating the emitted .go
    # files as packages of the root module.
    emitter-output-dir: '{output-dir}/output/notification-events/_go'
    module-path: 'github.com/openmeterio/openmeter'
    eventtype-import-path: 'github.com/openmeterio/openmeter/openmeter/notification/v4'
    # Package listing every Event type definition.
    definitions-import-path: 'github.com/openmeterio/openmeter/openmeter/notification/v4/definitions'
linter:
  extends:
    - '@openmeter/api-spec-aip/all'
