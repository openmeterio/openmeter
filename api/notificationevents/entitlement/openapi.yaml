openapi: 3.0.0
info:
  title: Entitlements.NotificationEvents
  description: Notification Event contracts owned by the entitlements domain.
  version: 0.0.0
tags: []
paths: {}
components:
  schemas:
    Address:
      type: object
      properties:
        country:
          allOf:
            - $ref: '#/components/schemas/CountryCode'
          description: |-
            Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
            alpha-2 format.
          title: Country
        postal_code:
          type: string
          description: Postal code.
          title: Postal Code
        state:
          type: string
          description: State or province.
          title: State
        city:
          type: string
          description: City.
          title: City
        line1:
          type: string
          description: First line of the address.
          title: Line 1
        line2:
          type: string
          description: Second line of the address.
          title: Line 2
        phone_number:
          type: string
          description: Phone number.
          title: Phone Number
      additionalProperties: false
      description: Address
    BillingCustomer:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
        - key
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
        description:
          type: string
          maxLength: 1024
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity creation date.
          readOnly: true
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity last update date.
          readOnly: true
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity deletion date.
          readOnly: true
        key:
          $ref: '#/components/schemas/ExternalResourceKey'
        usage_attribution:
          allOf:
            - $ref: '#/components/schemas/BillingCustomerUsageAttribution'
          description: Mapping to attribute metered usage to the customer by the event subject.
          title: Usage Attribution
        primary_email:
          type: string
          description: The primary email address of the customer.
          title: Primary Email
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the customer. Used for billing, tax and invoicing.
          title: Currency
        billing_address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The billing address of the customer. Used for tax and invoicing.
          title: Billing Address
      additionalProperties: false
      description: |-
        Customers can be individuals or organizations that can subscribe to plans and
        have access to features.
    BillingCustomerUsageAttribution:
      type: object
      required:
        - subject_keys
      properties:
        subject_keys:
          type: array
          items:
            $ref: '#/components/schemas/UsageAttributionSubjectKey'
          minItems: 0
          description: |-
            The subjects that are attributed to the customer. Can be empty when no usage
            event subjects are associated with the customer.
          title: Subject Keys
      additionalProperties: false
      description: |-
        Mapping to attribute metered usage to the customer. One customer can have zero
        or more subjects, but one subject can only belong to one customer.
    BillingEntitlementAccessValue:
      type: object
      required:
        - balance
        - usage
        - overage
        - total_available_grant_amount
        - grant_balances
      properties:
        balance:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            The remaining balance of the entitlement in the usage period at the evaluation
            time.
          readOnly: true
        usage:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The usage recorded in the usage period at the evaluation time.
          readOnly: true
        overage:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            The usage exceeding the available balance in the usage period at the evaluation
            time.
          readOnly: true
        total_available_grant_amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            The total amount granted and available to the entitlement at the evaluation
            time.
          readOnly: true
        grant_balances:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Numeric'
          description: The remaining balance of each grant, keyed by grant ID.
          readOnly: true
      additionalProperties: false
      description: |-
        Balance details of a metered entitlement at the evaluation time, which is the
        `at` query parameter when given and the current time otherwise.
      example:
        balance: '100'
        usage: '50'
        overage: '0'
        total_available_grant_amount: '100'
        grant_balances:
          additional_property: '1'
    BillingEntitlementIssueAfterReset:
      type: object
      required:
        - amount
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The amount granted after each reset, in the feature's unit.
          title: Initial grant amount
          example: '100'
        priority:
          type: integer
          format: uint8
          minimum: 1
          maximum: 255
          description: |-
            The priority of the grant created after each reset. Lower values have higher
            priority.
          title: Issue grant after reset priority
          default: 1
      additionalProperties: false
      description: |-
        Usage granted automatically after each reset of a metered entitlement. The
        balance returns to `amount` after every reset.
    BillingEntitlementMetered:
      type: object
      required:
        - id
        - type
        - feature
        - customer
        - active_from
        - created_at
        - updated_at
        - usage_period
        - current_usage_period
        - measure_usage_from
        - last_reset
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          readOnly: true
        type:
          type: string
          enum:
            - metered
          description: The type of the entitlement.
          title: Type
        feature:
          allOf:
            - $ref: '#/components/schemas/FeatureReference'
          description: The feature the customer is entitled to use.
          title: Feature
        customer:
          allOf:
            - $ref: '#/components/schemas/CustomerReference'
          description: The customer the entitlement belongs to.
          title: Customer
          readOnly: true
        labels:
          allOf:
            - $ref: '#/components/schemas/Labels'
          title: Labels
        active_from:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: The time from which the entitlement is active.
          title: Active from
          readOnly: true
        active_to:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: |-
            The time until which the entitlement is active. If not set, the entitlement is
            active until deleted.
          title: Active to
          readOnly: true
        created_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: The time the entitlement was created.
          readOnly: true
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: The time the entitlement was last updated.
          readOnly: true
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: The time the entitlement was deleted.
          readOnly: true
        usage_period:
          allOf:
            - $ref: '#/components/schemas/RecurringPeriod'
          description: |-
            The usage period of the entitlement. The balance resets at the start of every
            period.
          title: Usage period
          readOnly: true
        current_usage_period:
          allOf:
            - $ref: '#/components/schemas/ClosedPeriod'
          description: The current usage period of the entitlement.
          title: Current usage period
          readOnly: true
        is_soft_limit:
          type: boolean
          description: |-
            If true, the customer keeps access to the feature after the balance is
            exhausted.
          title: Soft limit
          default: false
        issue:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementIssueAfterReset'
          description: Usage granted automatically after each reset. Cannot be combined with `grants`.
          title: Issue after reset
        issue_after_reset:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The amount granted automatically after each reset.
          title: Initial grant amount
          deprecated: true
          example: '100'
        issue_after_reset_priority:
          type: integer
          format: uint8
          minimum: 1
          maximum: 255
          description: The priority of the grant created after each reset.
          title: Issue grant after reset priority
          deprecated: true
          default: 1
        preserve_overage_at_reset:
          type: boolean
          description: If true, the overage is preserved at reset. If false, the usage is reset to 0.
          title: Preserve overage at reset
          default: false
        measure_usage_from:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: The time from which usage is measured.
          title: Measure usage from
          readOnly: true
        last_reset:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: The time of the last reset.
          title: Last reset
          readOnly: true
      additionalProperties: false
      description: |-
        A metered entitlement grants a usage allowance for a feature. Access is
        determined by the balance: the allowance provided by grants is burnt down by
        usage.
    BillingEntitlementType:
      type: string
      enum:
        - metered
        - static
        - boolean
      description: The type of the entitlement.
    BillingEntitlementValueResult:
      type: object
      required:
        - type
        - feature_key
        - has_access
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementType'
          description: The type of the entitlement.
          example: static
          readOnly: true
        feature_key:
          allOf:
            - $ref: '#/components/schemas/ResourceKey'
          description: The feature key being evaluated.
          example: available_models
          readOnly: true
        has_access:
          type: boolean
          description: |-
            Whether the customer has access to the feature. Always true for `boolean` and
            `static` entitlements. Depends on balance for `metered` entitlements.
          example: true
          readOnly: true
        config:
          type: string
          description: |-
            Only available for static entitlements. Config is the JSON parsable
            configuration of the entitlement. Useful to describe per customer configuration.
          example: '{ "availableModels": ["gpt-5", "gpt-4o"] }'
          readOnly: true
        value:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementAccessValue'
          description: |-
            Only available for metered entitlements. The balance details of the entitlement
            at the evaluation time. Requires the `value` expand.
          readOnly: true
      additionalProperties: false
      description: Entitlement value result.
    BillingFeatureLLMTokenType:
      type: string
      enum:
        - input
        - output
        - cache_read
        - cache_write
        - reasoning
        - request
        - response
      description: Token type for LLM cost lookup.
    BillingFeatureLLMUnitCost:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - llm
          description: The type discriminator for LLM unit cost.
        provider_property:
          type: string
          description: |-
            Meter group-by property that holds the LLM provider. Use this when the meter has
            a group-by dimension for provider. Mutually exclusive with `provider`.
          title: Provider property
        provider:
          type: string
          description: |-
            Static LLM provider value (e.g., "openai", "anthropic"). Use this when the
            feature tracks a single provider. Mutually exclusive with `provider_property`.
          title: Provider
        model_property:
          type: string
          description: |-
            Meter group-by property that holds the model ID. Use this when the meter has a
            group-by dimension for model. Mutually exclusive with `model`.
          title: Model property
        model:
          type: string
          description: |-
            Static model ID value (e.g., "gpt-4", "claude-3-5-sonnet"). Use this when the
            feature tracks a single model. Mutually exclusive with `model_property`.
          title: Model
        token_type_property:
          type: string
          description: |-
            Meter group-by property that holds the token type. Use this when the meter has a
            group-by dimension for token type. Mutually exclusive with `token_type`.
          title: Token type property
        token_type:
          allOf:
            - $ref: '#/components/schemas/BillingFeatureLLMTokenType'
          description: |-
            Static token type value. Use this when the feature tracks a single token type
            (e.g., only input tokens). `request` is an alias for `input`, `response` is an
            alias for `output`. Mutually exclusive with `token_type_property`.
          title: Token type
        pricing:
          allOf:
            - $ref: '#/components/schemas/BillingFeatureLLMUnitCostPricing'
          description: |-
            Resolved per-token pricing from the LLM cost database. Populated in responses
            when the provider and model can be determined, either from static values or from
            meter group-by filters with exact matches.
          title: Resolved pricing
          readOnly: true
      additionalProperties: false
      description: |-
        LLM cost lookup configuration. Each dimension (provider, model, token type) can
        be specified as either a static value or a meter group-by property name
        (mutually exclusive).
    BillingFeatureLLMUnitCostPricing:
      type: object
      required:
        - input_per_token
        - output_per_token
      properties:
        input_per_token:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: Cost per input token in USD.
          title: Input per token
        output_per_token:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: Cost per output token in USD.
          title: Output per token
        cache_read_per_token:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: Cost per cache read token in USD.
          title: Cache read per token
        reasoning_per_token:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: Cost per reasoning token in USD.
          title: Reasoning per token
        cache_write_per_token:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: Cost per cache write token in USD.
          title: Cache write per token
      additionalProperties: false
      description: Resolved per-token pricing from the LLM cost database.
    BillingFeatureManualUnitCost:
      type: object
      required:
        - type
        - amount
      properties:
        type:
          type: string
          enum:
            - manual
          description: The type discriminator for manual unit cost.
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: Fixed per-unit cost amount in USD.
      additionalProperties: false
      description: A fixed per-unit cost amount.
    BillingFeatureUnitCost:
      type: object
      oneOf:
        - $ref: '#/components/schemas/BillingFeatureManualUnitCost'
        - $ref: '#/components/schemas/BillingFeatureLLMUnitCost'
      discriminator:
        propertyName: type
        mapping:
          manual: '#/components/schemas/BillingFeatureManualUnitCost'
          llm: '#/components/schemas/BillingFeatureLLMUnitCost'
      description: |-
        Per-unit cost configuration for a feature. Either a fixed manual amount or a
        dynamic LLM cost lookup.
    ClosedPeriod:
      type: object
      required:
        - from
        - to
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: |-
            The start of the period.

            The period is inclusive at the start.
          title: Start
          example: '2023-01-01T01:01:01.001Z'
        to:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: |-
            The end of the period.

            The period is exclusive at the end.
          title: End
          example: '2023-01-01T01:01:01.001Z'
      additionalProperties: false
      description: |-
        A period with defined start and end dates.

        The period is always inclusive at the start and exclusive at the end.
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      description: |-
        [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html) alpha-2 country
        code. Custom two-letter country codes are also supported for convenience.
      example: US
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: |-
        Three-letter [ISO4217](https://www.iso.org/iso-4217-currency-codes.html)
        currency code. Custom three-letter currency codes are also supported for
        convenience.
      example: USD
    CustomerReference:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ULID'
      additionalProperties: false
      description: Customer reference.
    DateTime:
      type: string
      format: date-time
      description: |-
        [RFC3339](https://tools.ietf.org/html/rfc3339) formatted date-time string in
        UTC.
      title: RFC3339 Date-Time
      example: '2023-01-01T01:01:01.001Z'
    EntitlementBalanceThreshold:
      type: object
      required:
        - type
        - value
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/EntitlementBalanceThresholdType'
          description: Condition kind of the threshold.
        value:
          type: number
          format: double
          description: Threshold value, interpreted according to the threshold type.
      additionalProperties: false
      description: A single entitlement balance threshold.
    EntitlementBalanceThresholdTriggeredV1Payload:
      type: object
      required:
        - entitlement
        - feature
        - customer
        - value
        - threshold
      properties:
        entitlement:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementMetered'
          description: Entitlement whose balance crossed the threshold.
        feature:
          allOf:
            - $ref: '#/components/schemas/Feature'
          description: Feature of the entitlement.
        customer:
          allOf:
            - $ref: '#/components/schemas/BillingCustomer'
          description: Customer owning the entitlement.
        value:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementValueResult'
          description: Value of the entitlement at evaluation time.
        threshold:
          allOf:
            - $ref: '#/components/schemas/EntitlementBalanceThreshold'
          description: Threshold that was crossed.
      additionalProperties: false
      description: |-
        Payload of `v1.entitlement.balance_threshold.triggered`.

        The entitlement, feature, customer and value have the shapes the v3 API
        returns. A change to those models changes this contract, so definitions.sum
        fails until the change is either accepted as a new Event type version or
        this payload is frozen into dedicated models.
    EntitlementBalanceThresholdTriggeredV1RuleConfig:
      type: object
      required:
        - thresholds
      properties:
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementBalanceThreshold'
          minItems: 1
          description: Thresholds evaluated against the entitlement balance.
        features:
          type: array
          items:
            $ref: '#/components/schemas/ResourceKey'
          description: Feature keys the Rule is limited to. All features when omitted.
      additionalProperties: false
      description: Rule configuration of `v1.entitlement.balance_threshold.triggered`.
    EntitlementBalanceThresholdType:
      type: string
      enum:
        - balance_at_or_below
        - usage_percentage_at_or_above
      description: Condition kind of an entitlement balance threshold.
    EntitlementUsageResetV1Payload:
      type: object
      required:
        - entitlement
        - feature
        - customer
        - value
      properties:
        entitlement:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementMetered'
          description: Entitlement whose usage was reset.
        feature:
          allOf:
            - $ref: '#/components/schemas/Feature'
          description: Feature of the entitlement.
        customer:
          allOf:
            - $ref: '#/components/schemas/BillingCustomer'
          description: Customer owning the entitlement.
        value:
          allOf:
            - $ref: '#/components/schemas/BillingEntitlementValueResult'
          description: Value of the entitlement right after the reset.
      additionalProperties: false
      description: |-
        Payload of `v1.entitlement.usage.reset`.

        The entitlement, feature, customer and value have the shapes the v3 API
        returns. A change to those models changes this contract, so definitions.sum
        fails until the change is either accepted as a new Event type version or
        this payload is frozen into dedicated models.
    EntitlementUsageResetV1RuleConfig:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/ResourceKey'
          description: Feature keys the Rule is limited to. All features when omitted.
      additionalProperties: false
      description: Rule configuration of `v1.entitlement.usage.reset`.
    ExternalResourceKey:
      type: string
      minLength: 1
      maxLength: 256
      description: |-
        ExternalResourceKey is a unique string that is used to identify a resource in an
        external system.
      title: External Resource Key
      example: 019ae40f-4258-7f15-9491-842f42a7d6ac
    Feature:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
        - key
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
        description:
          type: string
          maxLength: 1024
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity creation date.
          readOnly: true
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity last update date.
          readOnly: true
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity deletion date.
          readOnly: true
        key:
          $ref: '#/components/schemas/ResourceKey'
        meter:
          allOf:
            - $ref: '#/components/schemas/FeatureMeterReference'
          description: |-
            The meter that the feature is associated with and based on which usage is
            calculated. If not specified, the feature is static.
          title: Meter reference
        unit_cost:
          allOf:
            - $ref: '#/components/schemas/BillingFeatureUnitCost'
          description: |-
            Optional per-unit cost configuration. Use "manual" for a fixed per-unit cost, or
            "llm" to look up cost from the LLM cost database based on meter group-by
            properties.
          title: Unit cost
      additionalProperties: false
      description: A capability or billable dimension offered by a provider.
    FeatureMeterReference:
      type: object
      required:
        - id
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: The ID of the meter to associate with this feature.
          title: Meter ID
        filters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/QueryFilterStringMapItem'
          maxProperties: 10
          description: Filters to apply to the dimensions of the meter.
          title: Meter dimensions filters
      additionalProperties: false
      description: Reference to a meter associated with a feature.
    FeatureReference:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ULID'
      additionalProperties: false
      description: Feature reference.
    ISO8601Duration:
      type: string
      pattern: ^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$
      description: |-
        [ISO 8601 Duration](https://docs.digi.com/resources/documentation/digidocs/90001488-13/reference/r_iso_8601_duration_format.htm)
        string.
      title: ISO 8601 Duration
      example: P1Y
      format: ISO8601
    Numeric:
      type: string
      pattern: ^\-?[0-9]+(\.[0-9]+)?$
      description: Numeric represents an arbitrary precision number.
    QueryFilterString:
      type: object
      properties:
        eq:
          type: string
          description: The attribute equals the provided value.
        neq:
          type: string
          description: The attribute does not equal the provided value.
        in:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: The attribute is one of the provided values.
        nin:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: The attribute is not one of the provided values.
        contains:
          type: string
          description: The attribute contains the provided value.
        ncontains:
          type: string
          description: The attribute does not contain the provided value.
        and:
          minItems: 1
          maxItems: 10
          description: Combines the provided filters with a logical AND.
          type: array
          items:
            $ref: '#/components/schemas/QueryFilterString'
        or:
          minItems: 1
          maxItems: 10
          description: Combines the provided filters with a logical OR.
          type: array
          items:
            $ref: '#/components/schemas/QueryFilterString'
      additionalProperties: false
      description: |-
        A query filter for a string attribute. Operators are mutually exclusive, only
        one operator is allowed at a time.
      title: Query String Filter
    QueryFilterStringMapItem:
      type: object
      properties:
        exists:
          type: boolean
          description: The attribute exists.
        eq:
          type: string
          description: The attribute equals the provided value.
        neq:
          type: string
          description: The attribute does not equal the provided value.
        in:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: The attribute is one of the provided values.
        nin:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: The attribute is not one of the provided values.
        contains:
          type: string
          description: The attribute contains the provided value.
        ncontains:
          type: string
          description: The attribute does not contain the provided value.
        and:
          type: array
          items:
            $ref: '#/components/schemas/QueryFilterString'
          minItems: 1
          maxItems: 10
          description: Combines the provided filters with a logical AND.
        or:
          type: array
          items:
            $ref: '#/components/schemas/QueryFilterString'
          minItems: 1
          maxItems: 10
          description: Combines the provided filters with a logical OR.
      additionalProperties: false
      description: |-
        A query filter for an item in a string map attribute. Operators are mutually
        exclusive, only one operator is allowed at a time.
      title: Query String Map Item Filter
    RecurringPeriod:
      type: object
      required:
        - anchor
        - interval
      properties:
        anchor:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: A date-time anchor to base the recurring period on.
          title: Anchor time
          example: '2023-01-01T01:01:01.001Z'
        interval:
          allOf:
            - $ref: '#/components/schemas/ISO8601Duration'
          description: The interval duration in ISO 8601 format.
          title: Interval in ISO 8601 duration format
          example: P1M
      additionalProperties: false
      description: Recurring period with an anchor and an interval.
    ResourceKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
      description: A key is a unique string that is used to identify a resource.
      title: Resource Key
      example: resource_key
    ULID:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      description: ULID (Universally Unique Lexicographically Sortable Identifier).
      title: ULID
      example: 01G65Z755AFWAKHE12NY0CQ9FH
    UsageAttributionSubjectKey:
      type: string
      minLength: 1
      description: Subject key.
    Labels:
      title: Labels
      type: object
      example:
        env: test
      maxProperties: 50
      description: |
        Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

        Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
      additionalProperties:
        type: string
        pattern: ^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$
        minLength: 1
        maxLength: 63
