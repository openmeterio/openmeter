openapi: 3.0.0
info:
  title: Billing.NotificationEvents
  description: Notification Event contracts owned by the billing domain.
  version: 0.0.0
tags: []
paths: {}
components:
  schemas:
    Address:
      type: object
      properties:
        country:
          allOf:
            - $ref: '#/components/schemas/CountryCode'
          description: |-
            Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
            alpha-2 format.
          title: Country
        postal_code:
          type: string
          description: Postal code.
          title: Postal Code
        state:
          type: string
          description: State or province.
          title: State
        city:
          type: string
          description: City.
          title: City
        line1:
          type: string
          description: First line of the address.
          title: Line 1
        line2:
          type: string
          description: Second line of the address.
          title: Line 2
        phone_number:
          type: string
          description: Phone number.
          title: Phone Number
      additionalProperties: false
      description: Address
    BillingAppReference:
      type: object
      required:
        - id
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: The ID of the app.
      additionalProperties: false
      description: App reference.
    BillingChargeReference:
      type: object
      required:
        - id
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: Unique identifier for the charge.
          title: ID
          readOnly: true
      additionalProperties: false
      description: Reference to a charge associated with an invoice line.
    BillingCustomerUsageAttribution:
      type: object
      required:
        - subject_keys
      properties:
        subject_keys:
          type: array
          items:
            $ref: '#/components/schemas/UsageAttributionSubjectKey'
          minItems: 0
          description: |-
            The subjects that are attributed to the customer. Can be empty when no usage
            event subjects are associated with the customer.
          title: Subject Keys
      additionalProperties: false
      description: |-
        Mapping to attribute metered usage to the customer. One customer can have zero
        or more subjects, but one subject can only belong to one customer.
    BillingInvoiceAvailableActionDetails:
      type: object
      required:
        - resulting_state
      properties:
        resulting_state:
          type: string
          description: The extended status the invoice will transition to after performing this action.
          title: Resulting state
          readOnly: true
      additionalProperties: false
      description: Details about an available invoice action including the resulting state.
    BillingInvoiceAvailableActions:
      type: object
      properties:
        advance:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceAvailableActionDetails'
          description: Advance the invoice to the next workflow step.
          title: Advance
          readOnly: true
        approve:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceAvailableActionDetails'
          description: Approve the invoice for issuance.
          title: Approve
          readOnly: true
        delete:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceAvailableActionDetails'
          description: Delete the invoice.
          title: Delete
          readOnly: true
        retry:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceAvailableActionDetails'
          description: Retry a failed workflow step.
          title: Retry
          readOnly: true
        snapshot_quantities:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceAvailableActionDetails'
          description: Snapshot the current usage quantities.
          title: Snapshot quantities
          readOnly: true
      additionalProperties: false
      description: |-
        The set of state-transition actions available for an invoice in its current
        status.

        A field is present only when that action is permitted from the current state.
    BillingInvoiceCreatedV1Payload:
      type: object
      required:
        - invoice
      properties:
        invoice:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceStandard'
          description: The invoice as it was created.
      additionalProperties: false
      description: |-
        Payload of `v1.billing.invoice.created`.

        The invoice has the same shape as the v3 invoice API returns. A change to
        that API changes this contract, so definitions.sum fails until the change is
        either accepted as a new Event type version or this payload is frozen into
        dedicated models.
    BillingInvoiceCustomer:
      type: object
      required:
        - name
        - id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
        usage_attribution:
          allOf:
            - $ref: '#/components/schemas/BillingCustomerUsageAttribution'
          description: Mapping to attribute metered usage to the customer by the event subject.
          title: Usage Attribution
        billing_address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The billing address of the customer. Used for tax and invoicing.
          title: Billing Address
        id:
          $ref: '#/components/schemas/ULID'
        key:
          allOf:
            - $ref: '#/components/schemas/ExternalResourceKey'
          description: |-
            Optional external resource key for the customer.

            Omitted when the customer was created without a key. Unlike on the customer
            resource itself, the key is optional here because the invoice snapshot may
            predate or omit it.
      additionalProperties: false
      description: Snapshot of the customer's information at the time the invoice was issued.
    BillingInvoiceDetailedLine:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
        - service_period
        - totals
        - category
        - quantity
        - unit_price
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
        description:
          type: string
          maxLength: 1024
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity creation date.
          readOnly: true
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity last update date.
          readOnly: true
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity deletion date.
          readOnly: true
        service_period:
          allOf:
            - $ref: '#/components/schemas/ClosedPeriod'
          description: The service period covered by this detailed line.
          title: Service period
          readOnly: true
        totals:
          allOf:
            - $ref: '#/components/schemas/BillingTotals'
          description: Aggregated financial totals for the detailed line.
          title: Totals
          readOnly: true
        category:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceDetailedLineCostCategory'
          description: The cost category of this detailed line.
          title: Category
          default: regular
          readOnly: true
        discounts:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineDiscounts'
          description: Discounts applied to this detailed line.
          title: Discounts
          readOnly: true
        credits_applied:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLineCreditsApplied'
          description: Credit applied to this detailed line.
          title: Credit applied
          readOnly: true
        external_references:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineExternalReferences'
          description: External identifiers for this detailed line.
          title: External references
          readOnly: true
        quantity:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The quantity of the detailed line.
          title: Quantity
          readOnly: true
        unit_price:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The unit price of the detailed line.
          title: Unit Price
          readOnly: true
      additionalProperties: false
      description: |-
        A detailed (child) sub-line belonging to a parent invoice line.

        Detailed lines represent the individual flat-fee components that make up a
        usage-based parent line after quantity snapshotting.
    BillingInvoiceDetailedLineCostCategory:
      type: string
      enum:
        - regular
        - commitment
      description: Cost category of a detailed invoice line item.
    BillingInvoiceDiscountReason:
      type: string
      enum:
        - maximum_spend
        - ratecard_percentage
        - ratecard_usage
      description: The reason a discount was applied to an invoice line.
    BillingInvoiceExternalReferences:
      type: object
      properties:
        invoicing_id:
          type: string
          description: The ID assigned by the external invoicing app (e.g. Stripe invoice ID).
          title: Invoicing ID
          readOnly: true
        payment_id:
          type: string
          description: The ID assigned by the external payment app (e.g. Stripe payment intent ID).
          title: Payment ID
          readOnly: true
      additionalProperties: false
      description: External identifiers assigned to an invoice by third-party systems.
    BillingInvoiceLine:
      type: object
      oneOf:
        - $ref: '#/components/schemas/BillingInvoiceStandardLine'
      discriminator:
        propertyName: type
        mapping:
          standard_line: '#/components/schemas/BillingInvoiceStandardLine'
      description: |-
        A top-level line item on an invoice.

        Each line represents a single charge, typically associated with a rate card from
        a subscription. Detailed (child) lines are nested under `detailed_lines` when
        present.
    BillingInvoiceLineAmountDiscount:
      type: object
      required:
        - id
        - reason
        - amount
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: Unique identifier for the discount.
          title: ID
          readOnly: true
        reason:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceDiscountReason'
          description: The reason this discount was applied.
          title: Reason
          readOnly: true
        description:
          type: string
          description: Optional human-readable description of the discount.
          title: Description
          readOnly: true
        external_references:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineExternalReferences'
          description: External identifiers for this discount.
          title: External references
          readOnly: true
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The monetary amount deducted.
          title: Amount
          readOnly: true
      additionalProperties: false
      description: A monetary amount discount applied to an invoice line item.
    BillingInvoiceLineCreditsApplied:
      type: object
      required:
        - amount
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The monetary amount credited.
          title: Amount
          readOnly: true
        description:
          type: string
          description: Optional human-readable description of the credit allocation.
          title: Description
          readOnly: true
      additionalProperties: false
      description: A credit allocation applied to an invoice line item.
    BillingInvoiceLineDiscounts:
      type: object
      properties:
        amount:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLineAmountDiscount'
          description: Monetary amount discounts (e.g. from maximum spend commitments).
          title: Amount discounts
          readOnly: true
        usage:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLineUsageDiscount'
          description: Usage quantity discounts (e.g. free tier usage allowances).
          title: Usage discounts
          readOnly: true
      additionalProperties: false
      description: Discounts applied to an invoice line item.
    BillingInvoiceLineExternalReferences:
      type: object
      properties:
        invoicing_id:
          type: string
          description: The ID assigned by the external invoicing app.
          title: Invoicing ID
          readOnly: true
      additionalProperties: false
      description: External identifiers for an invoice line item assigned by third-party systems.
    BillingInvoiceLineRateCard:
      type: object
      required:
        - price
      properties:
        price:
          allOf:
            - $ref: '#/components/schemas/BillingPrice'
          description: The price definition used to calculate charges for this line.
          title: Price
        tax_config:
          allOf:
            - $ref: '#/components/schemas/TaxCodeConfig'
          description: Tax configuration snapshot for this line.
          title: Tax config
        feature_key:
          allOf:
            - $ref: '#/components/schemas/ResourceKey'
          description: The feature key associated with this line's rate card.
          title: Feature key
        discounts:
          allOf:
            - $ref: '#/components/schemas/BillingRateCardDiscounts'
          description: Discount configuration from the rate card.
          title: Discounts
        unit_config:
          allOf:
            - $ref: '#/components/schemas/BillingUnitConfig'
          description: |-
            Unit config snapshot applied when this line was billed, converting the raw
            metered quantity into the billed quantity. Frozen at billing time; read-only.
          title: Unit config
          readOnly: true
      additionalProperties: false
      description: Rate card configuration snapshot for a usage-based invoice line.
    BillingInvoiceLineUsageDiscount:
      type: object
      required:
        - id
        - reason
        - quantity
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: Unique identifier for the discount.
          title: ID
          readOnly: true
        reason:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceDiscountReason'
          description: The reason this discount was applied.
          title: Reason
          readOnly: true
        description:
          type: string
          description: Optional human-readable description of the discount.
          title: Description
          readOnly: true
        external_references:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineExternalReferences'
          description: External identifiers for this discount.
          title: External references
          readOnly: true
        quantity:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The usage quantity deducted (in billing units).
          title: Quantity
          readOnly: true
      additionalProperties: false
      description: A usage quantity discount applied to an invoice line item.
    BillingInvoiceNumber:
      type: string
      minLength: 1
      maxLength: 256
      description: |-
        InvoiceNumber is a unique identifier for the invoice, generated by the invoicing
        app.

        The uniqueness depends on a lot of factors:

        - app setting (unique per app or unique per customer)
        - multiple app scenarios (multiple apps generating invoices with the same
        prefix)
      example: INV-2024-01-01-01
    BillingInvoiceStandard:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - number
        - currency
        - supplier
        - customer
        - totals
        - service_period
        - type
        - status
        - status_details
        - workflow
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          readOnly: true
        description:
          type: string
          maxLength: 1024
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity creation date.
          readOnly: true
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity last update date.
          readOnly: true
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity deletion date.
          readOnly: true
        number:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceNumber'
          description: Human-readable invoice number generated by the invoicing app.
          title: Number
          readOnly: true
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Three-letter ISO 4217 currency code for the invoice.
          title: Currency
          readOnly: true
        supplier:
          allOf:
            - $ref: '#/components/schemas/BillingSupplier'
          description: |-
            Snapshot of the supplier's contact information at the time the invoice was
            issued.
          title: Supplier
        customer:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceCustomer'
          description: Snapshot of the customer's information at the time the invoice was issued.
          title: Customer
        totals:
          allOf:
            - $ref: '#/components/schemas/BillingTotals'
          description: Aggregated financial totals for the invoice.
          title: Totals
          readOnly: true
        service_period:
          allOf:
            - $ref: '#/components/schemas/ClosedPeriod'
          description: |-
            The service period covered by this invoice.

            For flat fee the service period can be empty which means `from` will be equals
            to `to`. In other cases those fields will be filled with the actual service
            period.
          title: Service period
          readOnly: true
        validation_issues:
          type: array
          items:
            $ref: '#/components/schemas/BillingValidationIssue'
          description: |-
            Validation issues found during invoice processing.

            Present only when there are one or more validation findings. An empty list is
            omitted.
          title: Validation issues
          readOnly: true
        external_references:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceExternalReferences'
          description: External identifiers assigned to this invoice by third-party systems.
          title: External references
          readOnly: true
        type:
          type: string
          enum:
            - standard
          description: Discriminator field identifying this as a standard invoice.
          title: Type
        status:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceStandardStatus'
          description: Current lifecycle status of the invoice.
          title: Status
          readOnly: true
        status_details:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceStatusDetails'
          description: Detailed status information including available actions and workflow state.
          title: Status details
          readOnly: true
        issued_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Timestamp when the invoice was issued to the customer.
          title: Issued at
          readOnly: true
        draft_until:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: |-
            Timestamp until which the invoice remains in draft state.

            The invoice advances automatically once this time is reached.
          title: Draft until
          readOnly: true
        quantity_snapshotted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Timestamp when usage quantities were last snapshotted for this invoice.
          title: Quantity snapshotted at
          readOnly: true
        collection_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Timestamp when collection was initiated for this invoice.
          title: Collection at
          readOnly: true
        due_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Timestamp when payment is due.
          title: Due at
          readOnly: true
        sent_to_customer_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Timestamp when the invoice was sent to the customer.
          title: Sent to customer at
          readOnly: true
        workflow:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceWorkflowSettings'
          description: Workflow configuration snapshot captured at invoice creation time.
          title: Workflow
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLine'
          description: |-
            Line items on this invoice.

            Always returned on single-resource GET; omitted on list endpoints unless
            explicitly expanded. Editable via update: existing lines are matched by `id`,
            lines without an `id` are created, and lines present on the invoice but omitted
            from the update request are deleted. Detailed (child) lines are always computed
            and cannot be edited directly.
          title: Lines
      additionalProperties: false
      description: A standard invoice for charges owed by the customer.
    BillingInvoiceStandardLine:
      type: object
      required:
        - name
        - created_at
        - updated_at
        - type
        - lifecycle_controller
        - service_period
        - totals
        - rate_card
        - detailed_lines
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
        description:
          type: string
          maxLength: 1024
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity creation date.
          readOnly: true
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity last update date.
          readOnly: true
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: An ISO-8601 timestamp representation of entity deletion date.
          readOnly: true
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: |-
            ID of the line.

            Optional on update: omit to create a new line, or supply the ID of an existing
            line to edit it. Existing lines omitted from an update's `lines` array are
            deleted.
          title: ID
        type:
          type: string
          enum:
            - standard_line
          description: The type of charge this line item represents.
          title: Type
        lifecycle_controller:
          allOf:
            - $ref: '#/components/schemas/BillingLifecycleController'
          description: |-
            Indicates whether this line item's lifecycle is controlled by OpenMeter or
            manually overridden by the API user.
          title: Lifecycle controller
          readOnly: true
        service_period:
          allOf:
            - $ref: '#/components/schemas/ClosedPeriod'
          description: |-
            The service period covered by this invoice, spanning the earliest line start to
            the latest line end across all of its lines.

            For an invoice with no lines the period is empty, which means `from` will be
            equal to `to`.
          title: Service period
        totals:
          allOf:
            - $ref: '#/components/schemas/BillingTotals'
          description: Aggregated financial totals for the line item.
          title: Totals
          readOnly: true
        discounts:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineDiscounts'
          description: Discounts applied to this line item.
          title: Discounts
          readOnly: true
        credits_applied:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLineCreditsApplied'
          description: Credit applied to this line item.
          title: Credit applied
          readOnly: true
        external_references:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineExternalReferences'
          description: External identifiers for this line item assigned by third-party systems.
          title: External references
          readOnly: true
        subscription:
          allOf:
            - $ref: '#/components/schemas/BillingSubscriptionReference'
          description: Reference to the subscription item that generated this line.
          title: Subscription reference
          readOnly: true
        rate_card:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceLineRateCard'
          description: The rate card configuration snapshot used to price this line item.
          title: Rate card
        detailed_lines:
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceDetailedLine'
          description: |-
            Detailed sub-lines that this line has been broken down into.

            Present when line has individual details.
          title: Detailed lines
          readOnly: true
        usage_quantity_detail:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceUsageQuantityDetail'
          description: |-
            Usage quantity details for this line when UnitConfig is in effect.

            Read-only; omitted for lines without unit conversion.
          title: Usage quantity detail
          readOnly: true
        charge:
          allOf:
            - $ref: '#/components/schemas/BillingChargeReference'
          description: Reference to the charge associated with this line item.
          title: Charge
          readOnly: true
      additionalProperties: false
      description: |-
        A top-level line item on an invoice.

        Each line represents a single charge, typically associated with a rate card from
        a subscription. Detailed (child) lines are nested under `detailed_lines` when
        present.
    BillingInvoiceStandardStatus:
      type: string
      enum:
        - draft
        - issuing
        - issued
        - payment_processing
        - overdue
        - paid
        - uncollectible
        - voided
      description: Lifecycle status of a standard invoice.
    BillingInvoiceStatusDetails:
      type: object
      required:
        - immutable
        - failed
        - extended_status
        - available_actions
      properties:
        immutable:
          type: boolean
          description: Whether the invoice is immutable (i.e. cannot be modified or deleted).
          title: Immutable
          readOnly: true
        failed:
          type: boolean
          description: Whether the invoice is in a failed state.
          title: Failed
          readOnly: true
        extended_status:
          type: string
          description: |-
            Fine-grained internal status string providing additional workflow detail beyond
            the top-level status enum.
          title: Extended status
          readOnly: true
        available_actions:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceAvailableActions'
          description: The set of state-transition actions currently available for this invoice.
          title: Available actions
          readOnly: true
      additionalProperties: false
      description: Detailed status information for a standard invoice.
    BillingInvoiceUpdatedV1Payload:
      type: object
      required:
        - invoice
      properties:
        invoice:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceStandard'
          description: The invoice after the update.
      additionalProperties: false
      description: |-
        Payload of `v1.billing.invoice.updated`.

        Shares the v3 invoice shape with `v1.billing.invoice.created`.
    BillingInvoiceUsageQuantityDetail:
      type: object
      required:
        - raw_quantity
        - invoiced_quantity
      properties:
        raw_quantity:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The raw quantity as reported by the meter (native units).
          title: Raw metered quantity
          readOnly: true
        invoiced_quantity:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            The net billed quantity for this line in converted units, after rounding and any
            usage discounts.
          title: Invoiced quantity
          readOnly: true
        display_unit:
          type: string
          description: The display unit label (e.g., "GB", "hours", "M tokens").
          title: Display unit
          readOnly: true
      additionalProperties: false
      description: |-
        Usage quantity details on an invoice line item when UnitConfig is in effect.

        Provides the full audit trail from raw meter output to the invoiced amount.
    BillingInvoiceWorkflow:
      type: object
      properties:
        invoicing:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceWorkflowInvoicingSettings'
          description: Invoicing settings for this invoice.
          title: Invoicing settings
        payment:
          allOf:
            - $ref: '#/components/schemas/BillingWorkflowPaymentSettings'
          description: Payment settings for this invoice.
          title: Payment settings
      additionalProperties: false
      description: |-
        Invoice-level snapshot of the workflow configuration.

        Contains only the settings that are meaningful for an already-created invoice:
        invoicing behaviour and payment settings. Collection alignment and tax policy
        are gather-time / profile-wide concerns and are not included.
    BillingInvoiceWorkflowAppsReferences:
      type: object
      required:
        - tax
        - invoicing
        - payment
      properties:
        tax:
          allOf:
            - $ref: '#/components/schemas/BillingAppReference'
          description: The tax app used for this workflow
          readOnly: true
        invoicing:
          allOf:
            - $ref: '#/components/schemas/BillingAppReference'
          description: The invoicing app used for this workflow
          readOnly: true
        payment:
          allOf:
            - $ref: '#/components/schemas/BillingAppReference'
          description: The payment app used for this workflow
          readOnly: true
      additionalProperties: false
      description: |-
        BillingInvoiceWorkflowAppsReferences represents the references (id) to the apps
        used by a billing profile
    BillingInvoiceWorkflowInvoicingSettings:
      type: object
      properties:
        auto_advance:
          type: boolean
          description: Whether to automatically issue the invoice after the draft_period has passed.
          default: true
        draft_period:
          type: string
          format: ISO8601
          description: The period for the invoice to be kept in draft status for manual reviews.
          example: P1D
          default: P0D
        due_after:
          type: string
          format: ISO8601
          description: The period after which the invoice is considered overdue if not paid.
          example: P30D
          readOnly: true
      additionalProperties: false
      description: |-
        Invoice-level invoicing settings.

        A subset of BillingWorkflowInvoicingSettings limited to fields that are
        meaningful per-invoice. progressive_billing is omitted as it is a gather-time /
        profile-level decision.
    BillingInvoiceWorkflowSettings:
      type: object
      required:
        - source_billing_profile
        - workflow
      properties:
        apps:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceWorkflowAppsReferences'
          description: The apps that will be used to orchestrate the invoice's workflow.
          title: Application that generated the invoice
          readOnly: true
        source_billing_profile:
          allOf:
            - $ref: '#/components/schemas/BillingProfileReference'
          description: The billing profile that was the source of this workflow snapshot.
          title: Source billing profile
          readOnly: true
        workflow:
          allOf:
            - $ref: '#/components/schemas/BillingInvoiceWorkflow'
          description: |-
            The workflow configuration that was active when the invoice was created.

            Only the fields that are meaningful at the per-invoice level are included:
            invoicing behaviour (auto-advance, draft period) and payment settings
            (collection method, due date). Profile-wide settings such as collection
            alignment, progressive billing, and tax policy are omitted.
          title: Workflow config
      additionalProperties: false
      description: Snapshot of the billing workflow configuration captured at invoice creation.
    BillingLifecycleController:
      type: string
      enum:
        - system
        - manual
      description: |-
        Identifies whether a resource lifecycle is controlled by OpenMeter or manually
        overridden by the API user.

        Values:

        - `system`: The resource lifecycle is controlled by OpenMeter.
        - `manual`: The resource lifecycle was manually overridden by the API user.
      title: Lifecycle controller
    BillingPartyAddresses:
      type: object
      required:
        - billing_address
      properties:
        billing_address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Billing address.
      additionalProperties: false
      description: A collection of addresses for the party.
    BillingPartyTaxIdentity:
      type: object
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/BillingTaxIdentificationCode'
          description: Normalized tax identification code shown on the original identity document.
      additionalProperties: false
      description: |-
        Identity stores the details required to identify an entity for tax purposes in a
        specific country.
    BillingPrice:
      type: object
      oneOf:
        - $ref: '#/components/schemas/BillingPriceFree'
        - $ref: '#/components/schemas/BillingPriceFlat'
        - $ref: '#/components/schemas/BillingPriceUnit'
        - $ref: '#/components/schemas/BillingPriceGraduated'
        - $ref: '#/components/schemas/BillingPriceVolume'
      discriminator:
        propertyName: type
        mapping:
          free: '#/components/schemas/BillingPriceFree'
          flat: '#/components/schemas/BillingPriceFlat'
          unit: '#/components/schemas/BillingPriceUnit'
          graduated: '#/components/schemas/BillingPriceGraduated'
          volume: '#/components/schemas/BillingPriceVolume'
      description: Price.
    BillingPriceFlat:
      type: object
      required:
        - type
        - amount
      properties:
        type:
          type: string
          enum:
            - flat
          description: The type of the price.
          title: Type
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The amount of the flat price.
          title: Amount
      additionalProperties: false
      description: Flat price.
    BillingPriceFree:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - free
          description: The type of the price.
          title: Type
      additionalProperties: false
      description: Free price.
    BillingPriceGraduated:
      type: object
      required:
        - type
        - tiers
      properties:
        type:
          type: string
          enum:
            - graduated
          description: The type of the price.
          title: Type
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/BillingPriceTier'
          minItems: 1
          description: The tiers of the graduated price. At least one tier is required.
          title: Tiers
      additionalProperties: false
      description: |-
        Graduated tiered price.

        Each tier's rate applies only to the usage within that tier. Pricing can change
        as cumulative usage crosses tier boundaries.

        When UnitConfig is present on the containing resource, tier boundaries
        (up_to_amount) are expressed in converted billing units.
    BillingPriceTier:
      type: object
      properties:
        up_to_amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            Up to and including this quantity will be contained in the tier. If undefined,
            the tier is open-ended (the last tier).
          title: Up to quantity
        flat_price:
          allOf:
            - $ref: '#/components/schemas/BillingPriceFlat'
          description: The flat price component of the tier. Charged once when the tier is entered.
          title: Flat price component
        unit_price:
          allOf:
            - $ref: '#/components/schemas/BillingPriceUnit'
          description: The unit price component of the tier. Charged per billing unit within the tier.
          title: Unit price component
      additionalProperties: false
      description: |-
        A price tier used in graduated and volume pricing.

        At least one price component (flat_price or unit_price) must be set. When
        UnitConfig is present on the containing resource, up_to_amount is expressed in
        converted billing units.
    BillingPriceUnit:
      type: object
      required:
        - type
        - amount
      properties:
        type:
          type: string
          enum:
            - unit
          description: The type of the price.
          title: Type
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The amount of the unit price.
          title: Amount
      additionalProperties: false
      description: |-
        Unit price.

        Charges a fixed rate per billing unit. When UnitConfig is present on the object,
        billing units are the converted quantities (e.g. GB instead of bytes).
    BillingPriceVolume:
      type: object
      required:
        - type
        - tiers
      properties:
        type:
          type: string
          enum:
            - volume
          description: The type of the price.
          title: Type
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/BillingPriceTier'
          minItems: 1
          description: The tiers of the volume price. At least one tier is required.
          title: Tiers
      additionalProperties: false
      description: |-
        Volume tiered price.

        The maximum quantity within a period determines the per-unit price for all units
        in that period.

        When UnitConfig is present on the containing resource, tier boundaries
        (up_to_amount) are expressed in converted billing units.
    BillingProfileReference:
      type: object
      required:
        - id
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: The ID of the billing profile.
      additionalProperties: false
      description: Billing profile reference.
    BillingRateCardDiscounts:
      type: object
      properties:
        percentage:
          type: number
          minimum: 0
          maximum: 100
          description: Percentage discount applied to the price (0–100).
        usage:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            Number of usage units granted free before billing starts. Only applies to
            usage-based lines (not flat fees). Usage is treated as zero until this amount is
            exhausted.
      additionalProperties: false
      description: Discount configuration for a rate card.
    BillingSubscriptionReference:
      type: object
      required:
        - id
        - phase
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ULID'
          description: The ID of the subscription.
          title: Subscription ID
          readOnly: true
        name:
          type: string
          description: |-
            The display name of the subscription.

            Only populated where the referencing endpoint documents a `subscription` expand
            that resolves it.
          title: Subscription name
          readOnly: true
        phase:
          type: object
          properties:
            id:
              allOf:
                - $ref: '#/components/schemas/ULID'
              description: The ID of the phase.
              title: Phase ID
              readOnly: true
            item:
              type: object
              properties:
                id:
                  allOf:
                    - $ref: '#/components/schemas/ULID'
                  description: The ID of the item.
                  title: Item ID
                  readOnly: true
              required:
                - id
              additionalProperties: false
              description: The item of the phase.
              title: Item ID
              readOnly: true
          required:
            - id
            - item
          additionalProperties: false
          description: The phase of the subscription.
          title: Phase ID
          readOnly: true
      additionalProperties: false
      description: |-
        Subscription reference represents a reference to the specific subscription item
        this entity represents.
    BillingSupplier:
      type: object
      properties:
        name:
          type: string
          description: Legal name or representation of the party.
        tax_id:
          allOf:
            - $ref: '#/components/schemas/BillingPartyTaxIdentity'
          description: |-
            The entity's legal identification used for tax purposes. They may have other
            numbers, but we're only interested in those valid for tax purposes.
        addresses:
          allOf:
            - $ref: '#/components/schemas/BillingPartyAddresses'
          description: Address for where information should be sent if needed.
        id:
          type: string
          description: Unique identifier for the party.
      additionalProperties: false
      description: |-
        Snapshot of the supplier's information at the time the invoice was issued.

        Structurally a read-only subset of `BillingParty` (the type configured on the
        billing profile), so the snapshot stays aligned with the source. `key` is
        omitted because it is not part of the snapshotted supplier data.
    BillingTaxBehavior:
      type: string
      enum:
        - inclusive
        - exclusive
      description: |-
        Tax behavior.

        This enum is used to specify whether tax is included in the price or excluded
        from the price.
    BillingTaxIdentificationCode:
      type: string
      minLength: 1
      maxLength: 32
      description: |-
        Tax identifier code is a normalized tax code shown on the original identity
        document.
    BillingTotals:
      type: object
      required:
        - amount
        - taxes_total
        - taxes_inclusive_total
        - taxes_exclusive_total
        - charges_total
        - discounts_total
        - credits_total
        - total
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total value of the resource before taxes, discounts and commitments.
          title: Amount
          readOnly: true
        taxes_total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total tax amount applied to the resource.
          title: Taxes total
          readOnly: true
        taxes_inclusive_total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total tax amount already included in the resource amount.
          title: Inclusive taxes total
          readOnly: true
        taxes_exclusive_total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total tax amount added on top of the resource amount.
          title: Exclusive taxes total
          readOnly: true
        charges_total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total amount contributed by additional charges.
          title: Charges total
          readOnly: true
        discounts_total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total amount deducted through discounts.
          title: Discounts total
          readOnly: true
        credits_total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The total amount deducted through credits before taxes are applied.
          title: Credits total
          readOnly: true
        total:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: The final total value of the resource after taxes, discounts and commitments.
          title: Total
          readOnly: true
      additionalProperties: false
      description: Totals contains the summaries of all calculations for a billing resource.
    BillingUnitConfig:
      type: object
      required:
        - operation
        - conversion_factor
      properties:
        operation:
          allOf:
            - $ref: '#/components/schemas/BillingUnitConfigOperation'
          description: The arithmetic operation to apply to the raw metered quantity.
          title: Conversion operation
        conversion_factor:
          allOf:
            - $ref: '#/components/schemas/Numeric'
          description: |-
            The factor used in the conversion operation.

            - For `divide`: `converted = raw / conversionFactor`.
            - For `multiply`: `converted = raw × conversionFactor`.

            Must be a positive non-zero value.
          title: Conversion factor
        rounding:
          allOf:
            - $ref: '#/components/schemas/BillingUnitConfigRoundingMode'
          description: |-
            The rounding mode applied to the converted quantity for invoicing.

            Defaults to none (no rounding). Entitlement checks always use the precise
            (unrounded) value.
          title: Rounding mode
          default: none
        precision:
          type: integer
          description: |-
            The number of decimal places to retain after rounding.

            Only meaningful when rounding is not "none". Defaults to 0 (round to whole
            numbers).
          title: Rounding precision (decimal places)
          default: 0
        display_unit:
          type: string
          description: |-
            A human-readable label for the converted unit shown on invoices and in the
            customer portal (e.g., "GB", "hours", "M tokens").

            Optional. When omitted, no unit label is rendered.
          title: Display unit label
      additionalProperties: false
      description: |-
        Unit conversion configuration.

        Transforms raw metered quantities into billing-ready units before pricing and
        entitlement evaluation. Stored with a resource's rating configuration so the
        same metered feature can be billed in different units across plans and charges.

        Examples:

        - Meter bytes, bill GB: operation=divide, conversionFactor=1e9,
        rounding=ceiling, displayUnit="GB"
        - Meter seconds, bill hours: operation=divide, conversionFactor=3600,
        rounding=ceiling, displayUnit="hours"
        - Cost + 20% margin: operation=multiply, conversionFactor=1.2
        - Bill per million tokens: operation=divide, conversionFactor=1e6,
        rounding=ceiling, displayUnit="M"

        v1 equivalents:

        - DynamicPrice(multiplier): operation=multiply, conversionFactor=multiplier +
        UnitPrice(amount=1)
        - PackagePrice(amount, quantityPerPkg): operation=divide,
        conversionFactor=quantityPerPkg, rounding=ceiling + UnitPrice(amount)
    BillingUnitConfigOperation:
      type: string
      enum:
        - divide
        - multiply
      description: |-
        The arithmetic operation used to convert raw metered units into billing units.

        - `divide`: Divide the metered quantity by the conversion factor (e.g., bytes ÷
        1e9 = GB).
        - `multiply`: Multiply the metered quantity by the conversion factor (e.g., cost
        × 1.2 = cost + 20% margin).
    BillingUnitConfigRoundingMode:
      type: string
      enum:
        - ceiling
        - floor
        - half_up
        - none
      description: |-
        The rounding mode applied to the converted quantity for invoicing.

        Rounding is applied only to the invoiced quantity. Entitlement balance checks
        use the precise decimal value after conversion.

        - `ceiling`: Round up to the next integer (typical for package-style billing).
        - `floor`: Round down to the previous integer.
        - `half_up`: Round to the nearest integer, with 0.5 rounding up.
        - `none`: No rounding; the converted value is used as-is.
    BillingValidationIssue:
      type: object
      required:
        - code
        - message
        - severity
      properties:
        code:
          type: string
          description: Machine-readable error code.
          title: Code
          readOnly: true
        message:
          type: string
          description: Human-readable description of the error.
          title: Message
          readOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: Additional structured context.
          title: Attributes
          readOnly: true
        severity:
          allOf:
            - $ref: '#/components/schemas/BillingValidationIssueSeverity'
          description: Severity of the validation issue.
          title: Severity
          readOnly: true
        field:
          type: string
          description: JSON path to the field that caused the validation issue, if applicable.
          title: Field path
          readOnly: true
        component:
          type: string
          description: Component that reported the validation issue, if applicable.
          title: Component
          readOnly: true
      additionalProperties: false
      description: A validation issue found while processing a billing resource.
    BillingValidationIssueSeverity:
      type: string
      enum:
        - critical
        - warning
      description: Severity level of a billing validation issue.
    BillingWorkflowPaymentChargeAutomaticallySettings:
      type: object
      required:
        - collection_method
      properties:
        collection_method:
          type: string
          enum:
            - charge_automatically
          description: The collection method for the invoice.
      additionalProperties: false
      description: |-
        Payment settings for a billing workflow when the collection method is charge
        automatically.
    BillingWorkflowPaymentSendInvoiceSettings:
      type: object
      required:
        - collection_method
      properties:
        collection_method:
          type: string
          enum:
            - send_invoice
          description: The collection method for the invoice.
        due_after:
          type: string
          format: ISO8601
          description: |-
            The period after which the invoice is due. With some payment solutions it's only
            applicable for manual collection method.
          example: P30D
          default: P30D
      additionalProperties: false
      description: |-
        Payment settings for a billing workflow when the collection method is send
        invoice.
    BillingWorkflowPaymentSettings:
      type: object
      oneOf:
        - $ref: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
        - $ref: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
      discriminator:
        propertyName: collection_method
        mapping:
          charge_automatically: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
          send_invoice: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
      description: Payment settings for a billing workflow.
    ClosedPeriod:
      type: object
      required:
        - from
        - to
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: |-
            The start of the period.

            The period is inclusive at the start.
          title: Start
          example: '2023-01-01T01:01:01.001Z'
        to:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: |-
            The end of the period.

            The period is exclusive at the end.
          title: End
          example: '2023-01-01T01:01:01.001Z'
      additionalProperties: false
      description: |-
        A period with defined start and end dates.

        The period is always inclusive at the start and exclusive at the end.
    CountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      description: |-
        [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html) alpha-2 country
        code. Custom two-letter country codes are also supported for convenience.
      example: US
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      description: |-
        Three-letter [ISO4217](https://www.iso.org/iso-4217-currency-codes.html)
        currency code. Custom three-letter currency codes are also supported for
        convenience.
      example: USD
    DateTime:
      type: string
      format: date-time
      description: |-
        [RFC3339](https://tools.ietf.org/html/rfc3339) formatted date-time string in
        UTC.
      title: RFC3339 Date-Time
      example: '2023-01-01T01:01:01.001Z'
    ExternalResourceKey:
      type: string
      minLength: 1
      maxLength: 256
      description: |-
        ExternalResourceKey is a unique string that is used to identify a resource in an
        external system.
      title: External Resource Key
      example: 019ae40f-4258-7f15-9491-842f42a7d6ac
    Numeric:
      type: string
      pattern: ^\-?[0-9]+(\.[0-9]+)?$
      description: Numeric represents an arbitrary precision number.
    ResourceKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9]+(?:_[a-z0-9]+)*$
      description: A key is a unique string that is used to identify a resource.
      title: Resource Key
      example: resource_key
    TaxCodeConfig:
      type: object
      properties:
        behavior:
          allOf:
            - $ref: '#/components/schemas/BillingTaxBehavior'
          description: |-
            Tax behavior.

            This enum is used to specify whether tax is included in the price or excluded
            from the price. If not specified, the billing profile is used to determine the
            tax behavior. If not specified in the billing profile, the provider's default
            behavior is used.
          title: Tax behavior
        code:
          allOf:
            - $ref: '#/components/schemas/TaxCodeReference'
          description: Tax code applied to the invoice line item.
          title: Tax code
      additionalProperties: false
      description: |-
        Tax configuration for a billable resource.

        Applies a tax code and tax behavior to the resulting invoice line items. When
        not set, the applicable default is used: the billing profile default tax
        configuration, then the organization default tax code.
      title: Tax code configuration
    TaxCodeReference:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ULID'
      additionalProperties: false
      description: TaxCode reference.
    ULID:
      type: string
      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
      description: ULID (Universally Unique Lexicographically Sortable Identifier).
      title: ULID
      example: 01G65Z755AFWAKHE12NY0CQ9FH
    UsageAttributionSubjectKey:
      type: string
      minLength: 1
      description: Subject key.
    Labels:
      title: Labels
      type: object
      example:
        env: test
      maxProperties: 50
      description: |
        Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

        Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
      additionalProperties:
        type: string
        pattern: ^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$
        minLength: 1
        maxLength: 63
