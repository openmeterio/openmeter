apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmeter.componentName" (list . "api") }}
  labels:
    {{- include "openmeter.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
    {{- include "openmeter.componentSelectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "openmeter.componentLabels" (list . "api") | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openmeter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "openmeter.initContainers" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- include "openmeter.securityContext" . | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["openmeter"]
          args: ["--address", "0.0.0.0:8080", "--telemetry-address", "0.0.0.0:10000", "--config", "/etc/openmeter/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: telemetry-http
              containerPort: 10000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: telemetry-http
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: telemetry-http
          resources:
            {{- toYaml (.Values.api.resources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/openmeter
            {{- include "openmeter.caBundleMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "openmeter.fullname" . }}
        {{- include "openmeter.caVolumes" . | nindent 8 }}
      {{- with (.Values.api.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.api.affinity | default .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.api.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
