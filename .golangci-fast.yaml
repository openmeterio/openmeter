# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - importas
    - ineffassign
    - misspell
    - nolintlint
    - sloglint
    - staticcheck
    - unconvert
    - wsl_v5
  settings:
    importas:
      no-unaliased: true
      alias:
        - pkg: 'github\.com/openmeterio/openmeter/api'
          alias: apiv1
        - pkg: 'github\.com/openmeterio/openmeter/api/models'
          alias: apiv1models
        - pkg: 'github\.com/openmeterio/openmeter/api/v3'
          alias: apiv3
        - pkg: 'github\.com/openmeterio/openmeter/api/v3/models'
          alias: apiv3models
    wsl_v5:
      # Keep assignment and defer grouping discretionary.
      default: none
      branch-max-lines: 2
      enable:
        - leading-whitespace
        - trailing-whitespace
        - after-block
        - branch
        - return
    misspell:
      locale: US
    nolintlint:
      require-specific: true
    revive:
      confidence: 0
    staticcheck:
      checks:
        - "all"
        - "-QF1008"
        - "-SA1019" # https://staticcheck.dev/docs/checks/#SA1019
        # FIXME: re-enable the following checks
        - "-ST1003"
        - "-ST1016"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - collector/benthos/internal
      - third_party$
      - builtin$
      - examples$
